<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0B2E">
<title>Giochi Invernali | Classifica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0A0B2E;
    --deep: #121047;
    --deep-2: #181563;
    --violet: #2B1C86;
    --cyan: #19E6FF;
    --lime: #C6FF3D;
    --white: #F4F7FF;
    --muted: #A8B0E0;
    --line: rgba(130, 150, 255, .28);
    --gold: #F0C75A;
    --silver: #C9D3E2;
    --bronze: #D8925F;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --text: "Barlow", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --cut: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--night);
    color: var(--white);
    font-family: var(--text);
    font-weight: 500;
    line-height: 1.45;
  }
  :focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  /* ---------- Barra dati di esempio ---------- */
  .demo { background: var(--lime); color: var(--night); text-align: center; padding: 8px 16px; font-weight: 700; font-size: 14px; }
  .demo[hidden] { display: none; }

  /* ---------- Navigazione ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10, 11, 46, .88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav-in { max-width: 1120px; margin: 0 auto; padding: 0 16px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font: italic 800 22px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .brand .hex { width: 34px; height: 34px; display: grid; place-items: center; background: var(--cyan); color: var(--night); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
  .brand .hex svg { width: 22px; height: 22px; }
  .nav a.lnk {
    color: var(--muted); text-decoration: none;
    font: italic 700 17px/1 var(--display); text-transform: uppercase; letter-spacing: .05em;
    padding: 10px 12px;
  }
  .nav a.lnk:hover { color: var(--white); }
  .nav-links { display: flex; gap: 4px; }
  @media (max-width: 560px) { .nav a.lnk { padding: 10px 7px; font-size: 15px; } .brand span.t { display: none; } }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(43, 28, 134, .95), transparent 70%),
      linear-gradient(180deg, #1A1270 0%, #0F0C55 55%, var(--night) 100%);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(112deg, transparent 0 52%, rgba(25, 230, 255, .10) 52% 60%, transparent 60% 67%, rgba(198, 255, 61, .07) 67% 70%, transparent 70%);
  }
  .hero-in {
    position: relative; z-index: 2;
    max-width: 1120px; margin: 0 auto;
    padding: 44px 16px 170px;
    display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: end;
  }
  h1 {
    margin: 0;
    font: italic 900 clamp(54px, 8.4vw, 108px)/.88 var(--display);
    text-transform: uppercase; letter-spacing: -.005em;
    text-shadow: 0 6px 0 rgba(10, 11, 46, .55);
  }
  .tag {
    display: inline-block; margin-top: 20px;
    background: var(--cyan); color: var(--night);
    font: italic 800 clamp(18px, 2.6vw, 24px)/1 var(--display); text-transform: uppercase; letter-spacing: .04em;
    padding: 10px 26px 10px 18px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  }
  .skyline { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 170px; z-index: 1; }
  .skyline * { vector-effect: non-scaling-stroke; }

  .next {
    background: rgba(8, 8, 40, .62);
    border: 1px solid var(--line);
    clip-path: var(--cut);
    padding: 20px 22px 22px;
  }
  .next .k { font: italic 700 15px/1 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--cyan); }
  .next .nn { font: italic 900 clamp(30px, 4.4vw, 44px)/1 var(--display); text-transform: uppercase; margin: 8px 0 4px; overflow-wrap: anywhere; }
  .next .dd { color: var(--muted); font-weight: 600; margin-bottom: 14px; }
  .count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .count div { background: var(--deep-2); border: 1px solid var(--line); text-align: center; padding: 8px 4px 6px; }
  .count b { display: block; font: italic 900 34px/1 var(--display); color: var(--lime); font-variant-numeric: tabular-nums; }
  .count span { font: 700 12px/1 var(--display); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .btn {
    display: inline-block; cursor: pointer; border: 0;
    background: var(--lime); color: var(--night);
    font: italic 800 17px/1 var(--display); text-transform: uppercase; letter-spacing: .05em;
    padding: 12px 24px 12px 18px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  }
  .btn:hover { background: #fff; }
  @media (max-width: 820px) {
    .hero-in { grid-template-columns: 1fr; padding-bottom: 150px; }
    .skyline { height: 130px; }
  }

  /* ---------- Layout ---------- */
  main { max-width: 1120px; margin: 0 auto; padding: 0 16px 56px; }
  section { margin-top: 44px; }
  h2 {
    margin: 0 0 18px;
    font: italic 900 clamp(30px, 5vw, 44px)/1 var(--display);
    text-transform: uppercase; letter-spacing: .01em;
    display: flex; align-items: center; gap: 12px;
  }
  h2::before { content: ""; width: 12px; height: 34px; background: var(--lime); transform: skewX(-20deg); flex: none; }

  /* ---------- Giornate (tessere) ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: -86px; position: relative; z-index: 3; }
  .tile {
    cursor: pointer; text-align: left; border: 0;
    clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
    padding: 14px 22px 14px 26px;
    display: grid; gap: 2px; min-height: 104px; align-content: end;
    background: rgba(24, 21, 99, .92);
    color: var(--white);
    position: relative;
  }
  .tile .tn { font: italic 900 44px/.9 var(--display); color: var(--cyan); }
  .tile .tt { font: italic 800 20px/1.05 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }
  .tile .ts { font: 600 13px/1.2 var(--text); color: var(--muted); }
  .tile.done { background: linear-gradient(135deg, var(--cyan), #5AA8FF); color: var(--night); }
  .tile.done .tn, .tile.done .ts { color: var(--night); }
  .tile.next { background: var(--lime); color: var(--night); }
  .tile.next .tn, .tile.next .ts { color: var(--night); }
  .tile:hover { filter: brightness(1.12); }
  @media (max-width: 820px) { .tiles { margin-top: -70px; } }

  /* ---------- Carte giocatore (stile card collezionabile) ---------- */
  .cardwrap { filter: drop-shadow(0 .55em .7em rgba(0, 0, 0, .5)); transition: transform .2s ease; display: inline-block; }
  .cardwrap:hover { transform: translateY(-5px); }
  .fut {
    --poly: polygon(50% 0, 86% 4.5%, 100% 9%, 100% 91%, 50% 100%, 0 91%, 0 9%, 14% 4.5%);
    width: 12.5em; height: 17.6em; padding: .2em;
    clip-path: var(--poly); background: var(--edge);
  }
  .fut .face {
    position: relative; overflow: hidden;
    height: 100%; clip-path: var(--poly);
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; padding: 0 .9em 1.75em;
  }
  .fut .face::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 0 38%, rgba(255, 255, 255, .28) 44%, transparent 52% 100%);
  }
  .fut.ice    { --edge: linear-gradient(135deg, #fff, #7fe9ff 45%, #8d7bff); --bg: linear-gradient(165deg, #dcfbff 0%, #7fd8ff 55%, #8f86ff 100%); --fg: #08123A; }
  .fut.gold   { --edge: linear-gradient(135deg, #fff3b0, #e0b84c 50%, #8f6a1c); --bg: linear-gradient(165deg, #f8e08c 0%, #d8ac38 60%, #b88a24 100%); --fg: #3A2A05; }
  .fut.silver { --edge: linear-gradient(135deg, #fff, #c9d3df 50%, #7d8898); --bg: linear-gradient(165deg, #eef3f9 0%, #b9c4d3 100%); --fg: #1B2533; }
  .fut.bronze { --edge: linear-gradient(135deg, #f6cfa9, #c77e4d 50%, #78431f); --bg: linear-gradient(165deg, #eab68b 0%, #bd7544 100%); --fg: #381A07; }
  .fut .top { position: relative; flex: 1; }
  .fut .rate { position: absolute; left: .95em; top: 2.2em; display: grid; justify-items: start; gap: .18em; }
  .fut .rate b { font: italic 900 3.5em/.85 var(--display); }
  .fut .rate .u { font: italic 800 .95em/1 var(--display); letter-spacing: .1em; }
  .fut .rk {
    font: italic 800 1em/1 var(--display); padding: .22em .6em .2em .45em; margin-top: .25em;
    border: .12em solid var(--fg); clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
  }
  .fut .rk.m1 { background: var(--gold); border-color: #5a3f06; color: #3A2A05; }
  .fut .rk.m2 { background: var(--silver); border-color: #3c4656; color: #1B2533; }
  .fut .rk.m3 { background: var(--bronze); border-color: #5b2f12; color: #381A07; }
  .fut .flk { width: 1.4em; height: 1.4em; margin-top: .3em; }
  .fut .avatar { position: absolute; right: -.5em; bottom: 0; width: 8.8em; height: 8.8em; color: var(--fg); opacity: .3; }
  .fut .nm {
    text-align: center; font: italic 800 1.6em/1 var(--display); text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: .1em 0 .22em;
  }
  .fut .rule { height: .11em; background: var(--fg); opacity: .35; margin: 0 .5em .5em; }
  .fut .stats { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; }
  .fut .stats b { display: block; font: 800 1.15em/1 var(--display); font-variant-numeric: tabular-nums; }
  .fut .stats i { display: block; font: 700 .64em/1.3 var(--display); font-style: normal; letter-spacing: .07em; opacity: .75; }

  /* ---------- Podio ---------- */
  .pod { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; justify-items: center; }
  .pod .s1 { font-size: 21px; }
  .pod .s2, .pod .s3 { font-size: 17px; }
  .empty { border: 2px dashed var(--line); padding: 28px 20px; text-align: center; font-weight: 600; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .pod .cardwrap { animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
    .pod .s1 { animation-delay: .3s; }
    .pod .s3 { animation-delay: .15s; }
    @keyframes rise { from { transform: translateY(40px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  }
  @media (max-width: 640px) {
    .pod { grid-template-columns: 1fr 1fr; row-gap: 18px; }
    .pod .s1 { grid-column: 1 / -1; grid-row: 1; font-size: 19px; }
    .pod .s2, .pod .s3 { font-size: 12.4px; }
  }


  /* ---------- Premio ---------- */
  .prize {
    display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center;
    padding: 22px 28px;
    background: linear-gradient(135deg, #F8E08C 0%, #D8AC38 60%, #B88A24 100%);
    color: #3A2A05; clip-path: var(--cut);
  }
  .prize svg { width: 96px; height: 80px; }
  .prize .k { font: italic 800 17px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; }
  .prize .tx { font: italic 900 clamp(24px, 3.6vw, 36px)/1.08 var(--display); text-transform: uppercase; margin-top: 6px; }
  @media (max-width: 560px) { .prize { grid-template-columns: 1fr; justify-items: start; padding: 20px; } }

  /* ---------- Classifica: controlli ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--deep); border: 1px solid var(--line); }
  .seg button {
    cursor: pointer; border: 0; background: transparent; color: var(--muted);
    font: italic 800 17px/1 var(--display); text-transform: uppercase; letter-spacing: .05em;
    padding: 12px 22px;
  }
  .seg button[aria-pressed="true"] { background: var(--cyan); color: var(--night); }
  .search {
    border: 1px solid var(--line); background: var(--deep); color: var(--white);
    padding: 11px 14px; font: 600 16px var(--text); width: min(100%, 270px);
  }
  .search::placeholder { color: var(--muted); }

  /* ---------- Tabella ---------- */
  .tablewrap { background: var(--deep); border: 1px solid var(--line); clip-path: var(--cut); overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 700px; }
  thead th {
    background: #1E1A78; color: var(--cyan);
    font: italic 800 16px/1 var(--display); text-transform: uppercase; letter-spacing: .06em;
    padding: 14px 10px; text-align: center; white-space: nowrap;
  }
  thead th small { display: block; margin: 4px auto 0; max-width: 110px; overflow: hidden; text-overflow: ellipsis; font: 600 11px/1.1 var(--text); letter-spacing: 0; text-transform: none; color: var(--muted); font-style: normal; }
  thead th.left { text-align: left; }
  thead th.soon { opacity: .6; }
  tbody tr { --row: #121047; }
  tbody tr:nth-child(even) { --row: #17145C; }
  td {
    background: var(--row); padding: 10px; text-align: center;
    font: 700 21px/1.1 var(--display); font-variant-numeric: tabular-nums;
    border-bottom: 1px solid rgba(130, 150, 255, .12);
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.pos, th.pos { position: sticky; left: 0; z-index: 2; width: 64px; }
  td.name, th.name { position: sticky; left: 64px; z-index: 2; min-width: 190px; text-align: left; }
  th.pos, th.name { z-index: 3; background: #1E1A78; }
  td.pos { font-style: italic; font-weight: 800; color: var(--muted); border-left: 6px solid transparent; }
  td.name { font-style: italic; font-weight: 800; text-transform: uppercase; font-size: 22px; border-right: 1px solid rgba(130, 150, 255, .15); }
  tr.m1 td.pos { border-left-color: var(--gold); color: var(--gold); }
  tr.m2 td.pos { border-left-color: var(--silver); color: var(--silver); }
  tr.m3 td.pos { border-left-color: var(--bronze); color: var(--bronze); }
  td.soon { opacity: .55; }
  .dash { opacity: .4; }
  .tot {
    display: inline-block; min-width: 74px; padding: 5px 18px 5px 14px;
    background: var(--lime); color: var(--night);
    font: italic 900 24px/1 var(--display);
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  tr.m1 .tot { background: var(--gold); }
  th.total { min-width: 120px; }
  .none td { padding: 28px; font-family: var(--text); font-style: normal; font-weight: 600; color: var(--muted); }

  /* ---------- Griglia carte ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 26px 12px; justify-items: center; }
  .cards .cardwrap { font-size: 14px; }
  .cards .none { grid-column: 1 / -1; padding: 28px; color: var(--muted); font-weight: 600; }
  @media (max-width: 430px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 4px; } .cards .cardwrap { font-size: 12.2px; } }

  /* ---------- Giochi ---------- */
  .games { display: grid; gap: 10px; }
  details.game { background: var(--deep); border: 1px solid var(--line); clip-path: var(--cut); }
  details.game summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
  details.game summary::-webkit-details-marker { display: none; }
  details.game[open] summary { background: var(--deep-2); border-bottom: 1px solid var(--line); }
  .game .num {
    flex: none; width: 54px; height: 44px; display: grid; place-items: center;
    background: var(--cyan); color: var(--night);
    font: italic 900 28px/1 var(--display);
    clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%);
  }
  .game.soon .num { background: #2A2790; color: var(--white); }
  .game .gname { flex: 1; font: italic 900 clamp(21px, 3.2vw, 29px)/1.05 var(--display); text-transform: uppercase; }
  .game .when { display: block; font: 600 14px/1.3 var(--text); text-transform: none; font-style: normal; color: var(--lime); margin-top: 4px; }
  .game .state { flex: none; font: italic 800 14px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 7px 14px 7px 10px; background: var(--cyan); color: var(--night); clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); }
  .game.soon .state { background: transparent; color: var(--muted); border: 0; box-shadow: inset 0 0 0 1px var(--line); }
  .game .chev { flex: none; width: 22px; height: 22px; color: var(--cyan); transition: transform .2s; }
  details.game[open] .chev { transform: rotate(180deg); }
  .game .body { padding: 18px 22px 24px; }
  .game .body p { margin: 0 0 12px; max-width: 70ch; color: #DDE2FF; }
  .game .body h3 { font: italic 800 20px/1 var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--cyan); margin: 18px 0 10px; }
  .game .body ul { margin: 0; padding-left: 22px; max-width: 70ch; color: #DDE2FF; }
  .game .body li { margin-bottom: 7px; }
  .game .scoring { display: grid; gap: 8px; max-width: 520px; }
  .game .scoring div { background: var(--deep-2); border-left: 6px solid var(--lime); padding: 11px 14px; font-weight: 700; }
  .game .later { color: var(--muted); }
  @media (max-width: 560px) { .game .state { display: none; } details.game summary { padding: 14px; gap: 12px; } }

  footer { text-align: center; padding: 0 16px 40px; font-size: 14px; font-weight: 600; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="arm"><path d="M0 0V-42M0-26l-10-10M0-26l10-10M0-14l-7-7M0-14l7-7"/></g>
    <symbol id="snowflake" viewBox="-50 -50 100 100">
      <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <use href="#arm"/><use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
        <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
      </g>
    </symbol>
    <symbol id="bust" viewBox="0 0 100 100">
      <circle cx="50" cy="32" r="17" fill="currentColor"/>
      <path d="M12 100C12 70 30 56 50 56s38 14 38 44z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="demo" id="demo" hidden>Dati di esempio. Sostituisci i partecipanti e imposta <code>esempio: false</code> nel blocco dati.</div>

<nav class="nav" aria-label="Sezioni">
  <div class="nav-in">
    <div class="brand"><span class="hex"><svg aria-hidden="true"><use href="#snowflake"/></svg></span><span class="t">Giochi Invernali</span></div>
    <div class="nav-links">
      <a class="lnk" href="#podio">Podio</a>
      <a class="lnk" href="#classifica">Classifica</a>
      <a class="lnk" href="#giochi">Giochi</a>
    </div>
  </div>
</nav>

<header class="hero">
  <svg class="skyline" id="skyline" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <div class="hero-in">
    <div>
      <h1>Giochi<br>Invernali</h1>
      <div class="tag" id="tag">Classifica generale</div>
    </div>
    <aside class="next" id="next" aria-label="Prossimo gioco"></aside>
  </div>
</header>

<main>
  <div class="tiles" id="tiles"></div>

  <section id="podio" aria-labelledby="podiumTitle">
    <h2 id="podiumTitle">Podio</h2>
    <div id="podium"></div>
  </section>

  <section id="premio" aria-labelledby="prizeTitle" hidden>
    <h2 id="prizeTitle">In palio</h2>
    <div class="prize">
      <svg viewBox="0 0 120 100" aria-hidden="true">
        <path d="M10 48Q10 10 60 10Q110 10 110 48Z" fill="#8F5A1A" stroke="#3A2A05" stroke-width="5" stroke-linejoin="round"/>
        <rect x="10" y="48" width="100" height="44" fill="#B97A28" stroke="#3A2A05" stroke-width="5" stroke-linejoin="round"/>
        <path d="M36 12V92M84 12V92" stroke="#3A2A05" stroke-width="5" fill="none"/>
        <rect x="48" y="40" width="24" height="26" rx="3" fill="#19E6FF" stroke="#3A2A05" stroke-width="5"/>
        <circle cx="60" cy="53" r="4" fill="#3A2A05"/>
      </svg>
      <div>
        <div class="k">Premio per il primo classificato</div>
        <div class="tx" id="prizeText"></div>
      </div>
    </div>
  </section>

  <section id="classifica" aria-labelledby="tableTitle">
    <h2 id="tableTitle">Classifica</h2>
    <div class="controls">
      <div class="seg" role="group" aria-label="Vista">
        <button type="button" id="vTable" aria-pressed="true">Tabella</button>
        <button type="button" id="vCards" aria-pressed="false">Carte</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Cerca un partecipante" aria-label="Cerca un partecipante" autocomplete="off">
    </div>
    <div class="tablewrap" id="tableView" tabindex="0" role="region" aria-label="Tabella classifica, scorri per vedere tutte le giornate">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="cards" id="cardsView" hidden></div>
  </section>

  <section id="giochi" aria-labelledby="gamesTitle">
    <h2 id="gamesTitle">I giochi</h2>
    <div class="games" id="games"></div>
  </section>
</main>

<footer id="footer"></footer>

<script>
/* =====================================================================
   BLOCCO DATI: è l'unica parte da modificare a ogni aggiornamento.
   - Ogni partecipante: ["Nome C.", [punti g1, g2, g3, g4, g5]]
   - Giornata non ancora giocata: null
   - Quando i dati sono reali, imposta esempio: false
   ===================================================================== */
const CONFIG = {
  sottotitolo: "Classifica generale",
  aggiornamento: "20 novembre 2026",      // es. "11 novembre 2026" (lascia vuoto per nasconderlo)
  premio: "Un montepremi: una scatola contenente da uno a millemila monete d’oro o punti Lafarmacia.",
  esempio: false
};

// Ogni giornata: nome, giocato (true se già svolta), quando (testo data e ora), quandoISO (per il conto alla rovescia), intro, regole (elenco) e punti (elenco)
const GIORNATE = [
  {
    nome: "Sarabanda",
    giocato: true,
    intro: "Il primo gioco dei Giochi Invernali. È già stato giocato: i punti sono nella colonna G1 della classifica.",
    regole: [], punti: []
  },
  {
    nome: "Indovina l’autore",
    giocato: true,
    quando: "Venerdì 13 novembre, ore 13:00",
    quandoISO: "2026-11-13T13:00:00+01:00",
    intro: "Il secondo gioco dei Giochi Invernali, già giocato: bisognava riconoscere il collega dalle sue parole. I punti sono nella colonna G2 della classifica.",
    regole: [
      "Ogni partecipante invia uno (massimo due) screenshot di una conversazione, con una frase o due parole che ritiene iconiche dell’autore.",
      "Va indicato il nome dell’autore del testo nello screenshot, altrimenti l’organizzatrice non sa quale sia la risposta giusta.",
      "Massimo 2 screenshot a persona.",
      "Lo scopo è scegliere uno screenshot così rappresentativo dell’autore da farlo indovinare."
    ],
    punti: [
      "2 punti se fai indovinare l’autore",
      "1 punto per ogni autore indovinato"
    ]
  },
  {
    nome: "Megaquiz",
    giocato: true,
    quando: "Venerdì 20 novembre",
    intro: "Il terzo gioco, già giocato: 27 domande hanno messo a dura prova conoscenza e arguzia dei partecipanti, per aggiudicarsi un complessivo di 81 punti. I punti sono nella colonna G3 della classifica.",
    regole: [],
    punti: ["81 punti complessivi in palio"]
  },
  { nome: "Quanto sta bene la gente?", giocato: false, intro: "", regole: [], punti: [] },
  { nome: "TBD", giocato: false, intro: "Gioco ancora da definire.", regole: [], punti: [] }
];

const PARTECIPANTI = [
  ["Crucitti", [16, 18, 54, null, null]],
  ["Peditto", [11, 45, 45, null, null]],
  ["Fiorucci", [2, 30, 0, null, null]],
  ["Cilia", [7, 31, 48, null, null]],
  ["Nancy", [5, 56, 30, null, null]],
  ["Papetti", [0, 43, 51, null, null]],
  ["Tito", [7, 29, 0, null, null]],
  ["Zanolli", [0, 34, 39, null, null]],
  ["Ponzoni", [7, 32, 0, null, null]],
  ["Pinto", [2, 7, 42, null, null]],
  ["Pomer", [2, 22, 42, null, null]],
  ["Volontè", [0, 0, 0, null, null]],
  ["Pavin", [3, 13, 33, null, null]],
  ["Clizia", [7, 12, 33, null, null]],
  ["Stefy", [2, 35, 36, null, null]],
  ["Mirabile", [0, 15, 42, null, null]],
  ["Rebecca", [0, 12, 0, null, null]],
  ["Edo", [0, 0, 0, null, null]],
  ["Seif Serag", [1, 0, 39, null, null]],
  ["Francesco de Mayda", [0, 0, 48, null, null]],
  ["Federica Ucella", [0, 0, 39, null, null]],
  ["Renz", [0, 0, 39, null, null]],
  ["Iacopo", [0, 0, 0, null, null]]
];
/* ===================== FINE BLOCCO DATI ============================== */

/* ---------- Dati di esempio (solo se esempio: true) ---------- */
function seeded(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
if (CONFIG.esempio) {
  const rnd = seeded(2026);
  PARTECIPANTI.forEach(p => { for (let g = 0; g < 1; g++) p[1][g] = 10 + 5 * Math.floor(rnd() * 19); });
}

/* ---------- Calcoli ---------- */
const isNum = v => typeof v === "number" && !isNaN(v);
const giocata = GIORNATE.map((_, i) => PARTECIPANTI.some(p => isNum(p[1][i])));
const nGiocate = giocata.filter(Boolean).length;
const fatta = i => !!(GIORNATE[i].giocato || giocata[i]);

const rows = PARTECIPANTI.map(([nome, punti]) => ({
  nome, punti,
  tot: punti.reduce((s, v) => s + (isNum(v) ? v : 0), 0)
}));
rows.sort((a, b) => b.tot - a.tot || a.nome.localeCompare(b.nome, "it"));
let lastTot = null, lastPos = 0;
rows.forEach((r, i) => { if (r.tot !== lastTot) { lastPos = i + 1; lastTot = r.tot; } r.pos = lastPos; r.idx = i; });

const fmt = n => n.toLocaleString("it-IT");
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Skyline di Milano (linee) ---------- */
(function drawSkyline() {
  const svg = document.getElementById("skyline");
  const base = 192, bg = "#0A0B2E", st = "#19E6FF";
  const spire = (x, y, h, w = 5) => `M${x - w} ${y}V${y - h * .62}L${x} ${y - h}L${x + w} ${y - h * .62}V${y}`;
  const out = [];
  const shape = d => out.push(`<path d="${d}" fill="${bg}" stroke="${st}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>`);
  const line = d => out.push(`<path d="${d}" fill="none" stroke="${st}" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>`);
  const tree = (x, y) => out.push(`<circle cx="${x}" cy="${y}" r="7" fill="${bg}" stroke="${st}" stroke-width="2.5" opacity=".75"/>`);

  shape(`M0 ${base}V150H44V${base}`);
  shape(`M880 ${base}V140H930V${base}`);
  shape(`M930 ${base}V160H990V120H1020V${base}`);
  shape(`M1020 ${base}V150H1080V130H1130V${base}`);
  shape(`M1130 ${base}V160H1200V${base}`);
  shape(`M1040 ${base}V118H1030V92H1110V118H1100V${base}`);
  line(`M1050 100V112M1070 100V112M1090 100V112`);

  shape(`M60 ${base}V64H110V${base}`);
  shape(`M126 ${base}V96H172V${base}`);
  [[60, 80], [110, 100], [60, 120], [110, 140], [60, 160], [110, 176]].forEach(([x, y]) => tree(x, y));
  [[126, 112], [172, 132], [126, 152], [172, 172]].forEach(([x, y]) => tree(x, y));

  shape(`M200 ${base}V76Q200 52 232 52Q264 52 264 76V${base}`);
  line(`M232 52V14`);
  line(`M206 100H258M206 124H258M206 148H258`);

  shape(`M280 ${base}V138H322V${base}`);
  shape(`M322 ${base}V150H380V${base}`);

  shape(`M400 ${base}V150H520V${base}`);
  shape(`M680 ${base}V150H800V${base}`);
  [415, 440, 465, 490, 710, 735, 760, 785].forEach((x, i) => shape(spire(x, 150, 38 + (i % 2) * 14, 5)));
  shape(`M512 ${base}V128L600 70L688 128V${base}`);
  [528, 560, 640, 672].forEach(x => shape(spire(x, 130, 58, 6)));
  shape(spire(600, 100, 80, 7));
  out.push(`<circle cx="600" cy="14" r="4" fill="${st}" opacity=".9"/>`);
  line(`M585 ${base}V162Q585 144 600 144Q615 144 615 162V${base}`);
  line(`M545 150V${base - 10}M565 150V${base - 10}M635 150V${base - 10}M655 150V${base - 10}`);
  line(`M0 ${base}H1200`);
  svg.innerHTML = out.join("");
})();

document.getElementById("tag").textContent = CONFIG.sottotitolo;
document.getElementById("demo").hidden = !CONFIG.esempio;

/* ---------- Apri un gioco dalla sezione "I giochi" ---------- */
function apriGioco(i) {
  const d = document.getElementById("game-" + i);
  if (!d) return;
  d.open = true;
  d.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
}

/* ---------- Prossimo gioco con conto alla rovescia ---------- */
const nextIdx = GIORNATE.findIndex((_, i) => !fatta(i));
(function renderNext() {
  const box = document.getElementById("next");
  if (nextIdx < 0) {
    box.appendChild(el("div", "k", "Giochi conclusi"));
    box.appendChild(el("div", "nn", "Grazie a tutti"));
    return;
  }
  const g = GIORNATE[nextIdx];
  box.appendChild(el("div", "k", "Prossimo gioco, giornata " + (nextIdx + 1)));
  box.appendChild(el("div", "nn", g.nome));
  box.appendChild(el("div", "dd", g.quando || "Data da definire"));

  if (g.quandoISO) {
    const target = new Date(g.quandoISO).getTime();
    const wrap = el("div", "count");
    const cells = ["giorni", "ore", "min", "sec"].map(lbl => {
      const d = el("div"); const b = el("b", null, "0"); d.appendChild(b); d.appendChild(el("span", null, lbl));
      wrap.appendChild(d); return b;
    });
    const live = el("div", "dd", "È il momento!"); live.hidden = true;
    box.appendChild(wrap); box.appendChild(live);
    const tick = () => {
      let s = Math.floor((target - Date.now()) / 1000);
      if (s <= 0) { wrap.hidden = true; live.hidden = false; return false; }
      const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
      v.forEach((n, k) => cells[k].textContent = k === 0 ? String(n) : String(n).padStart(2, "0"));
      return true;
    };
    if (tick()) { const t = setInterval(() => { if (!tick()) clearInterval(t); }, 1000); }
  }
  const b = el("button", "btn", "Vedi le regole");
  b.type = "button";
  b.addEventListener("click", () => apriGioco(nextIdx));
  box.appendChild(b);
})();

/* ---------- Tessere delle giornate ---------- */
(function renderTiles() {
  const host = document.getElementById("tiles");
  GIORNATE.forEach((g, i) => {
    const cls = fatta(i) ? "done" : (i === nextIdx ? "next" : "soon");
    const t = el("button", "tile " + cls);
    t.type = "button";
    t.appendChild(el("span", "tn", String(i + 1)));
    t.appendChild(el("span", "tt", g.nome));
    t.appendChild(el("span", "ts", fatta(i) ? "Giocato" : (g.quando || "In arrivo")));
    t.addEventListener("click", () => apriGioco(i));
    host.appendChild(t);
  });
})();

/* ---------- Carta giocatore ---------- */
function tierOf(r) {
  if (nGiocate === 0) return "bronze";
  if (r.pos <= 3) return "ice";
  if (r.idx < 10) return "gold";
  if (r.idx < 20) return "silver";
  return "bronze";
}
function buildCard(r, sizeClass) {
  const wrap = el("div", "cardwrap " + (sizeClass || ""));
  const c = el("article", "fut " + tierOf(r));
  c.setAttribute("aria-label", r.nome + ", " + fmt(r.tot) + " punti, posizione " + r.pos);
  const f = el("div", "face");
  const top = el("div", "top");
  const rate = el("div", "rate");
  rate.appendChild(el("b", null, fmt(r.tot)));
  rate.appendChild(el("span", "u", "PUNTI"));
  rate.appendChild(el("span", "rk" + (nGiocate > 0 && r.pos <= 3 ? " m" + r.pos : ""), "#" + r.pos));
  rate.insertAdjacentHTML("beforeend", '<svg class="flk" aria-hidden="true"><use href="#snowflake"/></svg>');
  top.appendChild(rate);
  top.insertAdjacentHTML("beforeend", '<svg class="avatar" viewBox="0 0 100 100" aria-hidden="true"><use href="#bust"/></svg>');
  f.appendChild(top);
  f.appendChild(el("div", "nm", r.nome));
  f.appendChild(el("div", "rule"));
  const st = el("div", "stats");
  GIORNATE.forEach((_, i) => {
    const d = el("div");
    d.appendChild(el("b", null, isNum(r.punti[i]) ? fmt(r.punti[i]) : "–"));
    d.appendChild(el("i", null, "G" + (i + 1)));
    st.appendChild(d);
  });
  f.appendChild(st);
  c.appendChild(f);
  wrap.appendChild(c);
  return wrap;
}

/* ---------- Podio ---------- */
(function renderPodium() {
  const host = document.getElementById("podium");
  if (nGiocate === 0) {
    host.appendChild(el("div", "empty", "Il podio compare dopo la prima giornata."));
    return;
  }
  const grid = el("div", "pod");
  const top = rows.slice(0, 3);
  [[top[1], "s2", 2], [top[0], "s1", 1], [top[2], "s3", 3]].forEach(([r, cls]) => {
    if (r) grid.appendChild(buildCard(r, cls));
  });
  host.appendChild(grid);
})();

/* ---------- Premio ---------- */
(function renderPrize() {
  if (!CONFIG.premio) return;
  document.getElementById("prizeText").textContent = CONFIG.premio;
  document.getElementById("premio").hidden = false;
})();

/* ---------- Tabella ---------- */
(function renderHead() {
  const tr = el("tr");
  tr.appendChild(el("th", "pos", "Pos"));
  tr.appendChild(el("th", "name left", "Partecipante"));
  GIORNATE.forEach((g, i) => {
    const th = el("th", giocata[i] ? "" : "soon", "G" + (i + 1));
    th.appendChild(el("small", null, g.nome));
    th.title = "Giornata " + (i + 1) + ": " + g.nome;
    tr.appendChild(th);
  });
  tr.appendChild(el("th", "total", "Totale"));
  document.getElementById("thead").appendChild(tr);
})();

function filtra(q) {
  q = (q || "").trim().toLowerCase();
  return q ? rows.filter(r => r.nome.toLowerCase().includes(q)) : rows;
}
function renderBody(q) {
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  const list = filtra(q);
  if (!list.length) {
    const tr = el("tr", "none"); const td = el("td", null, "Nessun partecipante trovato.");
    td.colSpan = GIORNATE.length + 3; tr.appendChild(td); tb.appendChild(tr); return;
  }
  list.forEach(r => {
    const tr = el("tr", nGiocate > 0 && r.pos <= 3 ? "m" + r.pos : "");
    tr.appendChild(el("td", "pos", String(r.pos)));
    tr.appendChild(el("td", "name", r.nome));
    GIORNATE.forEach((_, i) => {
      const v = r.punti[i];
      const td = el("td", giocata[i] ? "" : "soon");
      if (isNum(v)) td.textContent = fmt(v); else td.appendChild(el("span", "dash", "–"));
      tr.appendChild(td);
    });
    const tt = el("td"); tt.appendChild(el("span", "tot", fmt(r.tot)));
    tr.appendChild(tt);
    tb.appendChild(tr);
  });
}
function renderCards(q) {
  const host = document.getElementById("cardsView");
  host.innerHTML = "";
  const list = filtra(q);
  if (!list.length) { host.appendChild(el("div", "none", "Nessun partecipante trovato.")); return; }
  list.forEach(r => host.appendChild(buildCard(r)));
}
function renderAll() {
  const q = document.getElementById("search").value;
  renderBody(q); renderCards(q);
}
renderAll();
document.getElementById("search").addEventListener("input", renderAll);

/* Cambio vista: tabella / carte */
const vT = document.getElementById("vTable"), vC = document.getElementById("vCards");
function setView(cards) {
  vT.setAttribute("aria-pressed", String(!cards));
  vC.setAttribute("aria-pressed", String(cards));
  document.getElementById("tableView").hidden = cards;
  document.getElementById("cardsView").hidden = !cards;
}
vT.addEventListener("click", () => setView(false));
vC.addEventListener("click", () => setView(true));

/* ---------- Sezione giochi ---------- */
(function renderGames() {
  const host = document.getElementById("games");
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  GIORNATE.forEach((g, i) => {
    const done = fatta(i);
    const d = el("details", "game" + (done ? "" : " soon"));
    d.id = "game-" + i;
    const sum = el("summary");
    sum.appendChild(el("span", "num", String(i + 1)));
    const gn = el("span", "gname", g.nome);
    if (g.quando) gn.appendChild(el("span", "when", g.quando));
    sum.appendChild(gn);
    sum.appendChild(el("span", "state", done ? "Giocato" : "In arrivo"));
    sum.insertAdjacentHTML("beforeend", chev);
    d.appendChild(sum);

    const b = el("div", "body");
    if (g.intro) b.appendChild(el("p", null, g.intro));
    if (g.regole.length) {
      b.appendChild(el("h3", null, "Come si gioca"));
      const ul = el("ul"); g.regole.forEach(r => ul.appendChild(el("li", null, r))); b.appendChild(ul);
    }
    if (g.punti.length) {
      b.appendChild(el("h3", null, "Come si fanno i punti"));
      const sc = el("div", "scoring"); g.punti.forEach(r => sc.appendChild(el("div", null, r))); b.appendChild(sc);
    }
    if (!g.intro && !g.regole.length && !g.quando) b.appendChild(el("p", "later", "Regole in arrivo."));
    d.appendChild(b);
    host.appendChild(d);
  });
})();

document.getElementById("footer").textContent = CONFIG.aggiornamento ? "Aggiornato al " + CONFIG.aggiornamento : "";
</script>
</body>
</html>
